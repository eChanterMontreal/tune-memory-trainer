<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tune Memory Trainer</title>
<meta name="description" content="Memoriza el arranque de las tunes de gaita: de oído, leyendo la partitura y reconociendo el tiempo.">
<meta property="og:type" content="website">
<meta property="og:title" content="Tune Memory Trainer · Bagpipes">
<meta property="og:description" content="Aprende el arranque de cada tune: de oído, por partitura y por tiempo. ES · EN · FR">
<meta property="og:image" content="https://echantermontreal.github.io/tune-memory-trainer/og.png">
<meta property="og:url" content="https://echantermontreal.github.io/tune-memory-trainer/">
<meta name="theme-color" content="#14231c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#f4f1ea; --card:#fffdf8; --ink:#1d2420; --muted:#6b726c; --line:#ddd6c8;
  --accent:#1f5c45; --accent2:#a8322d; --ok:#2e7d4f; --bad:#b3362f; --hl:#c98a12;
  --chip:#ece6d9;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#111814; --card:#18211c; --ink:#ece8de; --muted:#9aa39c; --line:#2c3831;
    --accent:#5fbf93; --accent2:#e2706a; --ok:#5fbf93; --bad:#e2706a; --hl:#f0b43c; --chip:#22302a; }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit}
header{padding:14px 16px 8px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
header h1{margin:0;font:700 20px/1.1 Georgia,"Times New Roman",serif;letter-spacing:.2px}
header .sub{color:var(--muted);font-size:13px}
main{max-width:760px;margin:0 auto;padding:0 12px 96px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);z-index:10;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;border:0;background:none;padding:10px 4px 12px;font-size:13px;color:var(--muted);cursor:pointer}
nav.tabs button .ic{display:block;font-size:19px;line-height:1.2}
nav.tabs button.on{color:var(--accent);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.modes{display:flex;gap:6px;overflow-x:auto;padding:4px 0 2px;scrollbar-width:none}
.modes button{border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:7px 13px;white-space:nowrap;cursor:pointer;font-size:14px}
.modes button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.score-line{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin:6px 2px 0}
.prompt{font-size:15px;color:var(--muted);margin:2px 0 10px}
.big-play{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:22px;border-radius:14px;border:0;background:var(--accent);color:#fff;font-size:18px;font-weight:600;cursor:pointer}
.big-play:active{transform:scale(.99)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--chip);border-radius:10px;padding:9px 14px;cursor:pointer;font-size:15px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.small{padding:6px 10px;font-size:13px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
@media (max-width:420px){.opts{grid-template-columns:1fr}}
.opt{border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:13px 12px;text-align:left;cursor:pointer;font-size:16px;min-height:52px}
.opt:hover{border-color:var(--accent)}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--card))}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--card))}
.opt[disabled]{cursor:default}
.fb{font-weight:700;font-size:17px;margin:12px 0 4px}
.fb.ok{color:var(--ok)} .fb.bad{color:var(--bad)}
.reveal h3{margin:4px 0 0;font:700 20px/1.2 Georgia,serif}
.reveal .meta{color:var(--muted);font-size:13px;margin-bottom:4px}
.staff{width:100%;overflow-x:auto;margin:6px 0}
.staff svg{display:block;min-width:340px;width:100%;height:auto}
.staff .n{cursor:pointer}
.staff .n.on .hd{fill:var(--hl);stroke:var(--hl)}
.staff .n.on .nm{fill:var(--hl);font-weight:700}
.seq{font:600 15px/1.6 ui-monospace,Consolas,monospace;letter-spacing:.3px;word-spacing:2px;color:var(--ink);background:var(--chip);border-radius:8px;padding:6px 10px;margin:6px 0}
.seq .bar{color:var(--muted);font-weight:400}
.hint{color:var(--muted);font-size:13px}
.lib-item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.lib-item:last-child{border-bottom:0}
.lib-item .t{font-weight:600}
.lib-item .m{color:var(--muted);font-size:12.5px}
.pill{font-size:11.5px;border-radius:999px;padding:2px 8px;background:var(--chip);color:var(--muted);white-space:nowrap}
.pill.local{background:color-mix(in srgb,var(--accent) 18%,var(--card));color:var(--accent)}
.bar-wrap{height:8px;background:var(--chip);border-radius:6px;overflow:hidden;min-width:70px}
.bar-fill{height:100%;background:var(--accent)}
table.st{width:100%;border-collapse:collapse;font-size:14px}
table.st td{padding:7px 4px;border-bottom:1px solid var(--line);vertical-align:middle}
table.st td.num{text-align:right;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--chip);border-radius:10px;padding:10px;text-align:center}
.kpi b{display:block;font-size:22px}
.kpi span{font-size:12px;color:var(--muted)}
label.set{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
label.set:last-child{border-bottom:0}
select,input[type=range]{font:inherit}
.hidden{display:none!important}
h2{font:700 17px/1.2 Georgia,serif;margin:4px 0 8px}
.recall-title{font:700 26px/1.2 Georgia,serif;text-align:center;margin:18px 0 6px}
.center{text-align:center}
.err{color:var(--bad);font-size:13px}
header{justify-content:space-between;align-items:center}
.hdr-l{display:flex;flex-direction:column;gap:2px}
.hdr-r{display:flex;gap:6px;align-items:center}
.lang{border:1px solid var(--line);background:var(--chip);border-radius:8px;padding:5px 6px;font-size:13px;color:var(--ink)}
.search{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;margin-bottom:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.chips button{border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer}
.chips button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.grp-h{font:700 14px/1 Georgia,serif;color:var(--accent);margin:14px 0 2px;text-transform:uppercase;letter-spacing:.6px}
.lib-item .sq{font:600 12px/1.4 ui-monospace,Consolas,monospace;color:var(--muted);margin-top:2px}
.lib-item.open{background:var(--chip);border-radius:10px}
.lib-detail{padding:4px 2px 12px;border-bottom:1px solid var(--line)}
.meter-opts .opt{text-align:center;font:700 22px/1 Georgia,serif}
.tip{background:var(--chip);border-radius:10px;padding:10px 12px;font-size:14px;margin:8px 0}

</style>
</head>
<body>
<header>
  <div class="hdr-l"><h1>Tune Memory Trainer <small style="font-size:11px;font-weight:400;opacity:.55">v1.2</small></h1><span class="sub" id="libInfo"></span></div>
  <div class="hdr-r">
    <button class="btn small hidden" id="installBtn"></button>
    <select class="lang" id="langSel" aria-label="Language"><option value="es">ES</option><option value="en">EN</option><option value="fr">FR</option></select>
  </div>
</header>
<main>
  <section id="v-practice">
    <div class="modes" id="modes">
      <button data-m="audio"></button><button data-m="visual"></button><button data-m="combo"></button><button data-m="recall"></button><button data-m="meter"></button>
    </div>
    <div class="score-line"><span id="sess"></span><span id="streak"></span></div>
    <div class="card" id="qcard"></div>
  </section>

  <section id="v-library" class="hidden">
    <div class="card">
      <h2 data-t="repTitle"></h2>
      <input class="search" id="libSearch" type="search">
      <div class="chips" id="libChips"></div>
      <div id="libList"></div>
      <p class="hint" id="libSource" style="margin-top:12px"></p>
    </div>
    <div class="card">
      <h2 data-t="addTitle"></h2>
      <p class="hint" data-t="addHint"></p>
      <div class="row"><input type="file" id="fileIn" accept=".bww,.bmw,text/plain" multiple></div>
      <div id="addMsg" class="hint"></div>
    </div>
  </section>

  <section id="v-stats" class="hidden">
    <div class="card"><div class="kpis" id="kpis"></div></div>
    <div class="card"><h2 data-t="confTitle"></h2><div id="confList"></div></div>
    <div class="card"><h2 data-t="simTitle"></h2><p class="hint" data-t="simHint"></p><div id="simList"></div></div>
    <div class="card"><h2 data-t="perTune"></h2><table class="st" id="perTune"></table></div>
  </section>

  <section id="v-settings" class="hidden">
    <div class="card">
      <h2 data-t="setTitle"></h2>
      <label class="set"><span data-t="setLang"></span>
        <select id="setLang"><option value="es">Español</option><option value="en">English</option><option value="fr">Français</option></select></label>
      <label class="set"><span data-t="setBars"></span>
        <select id="setBars"><option value="2"></option><option value="4"></option></select></label>
      <label class="set"><span data-t="setSpeed"></span><span class="row"><input type="range" id="setSpeed" min="0.6" max="1.4" step="0.05"><span id="speedVal" class="hint"></span></span></label>
      <label class="set"><span data-t="setDrones"></span><input type="checkbox" id="setDrones"></label>
      <label class="set"><span data-t="setGrace"></span><input type="checkbox" id="setGrace"></label>
      <label class="set"><span data-t="setHard"></span><input type="checkbox" id="setHard"></label>
    </div>
    <div class="card">
      <h2 data-t="appTitle"></h2>
      <div class="row"><button class="btn primary hidden" id="installBtn2"></button><button class="btn" id="shareBtn"></button></div>
      <p class="hint" data-t="installHint"></p>
    </div>
    <div class="card">
      <h2 data-t="dataTitle"></h2>
      <div class="row"><button class="btn" id="resetStats"></button></div>
      <p class="hint" data-t="dataHint"></p>
    </div>
  </section>
</main>

<nav class="tabs" id="tabs">
  <button data-v="practice" class="on"><span class="ic">▶</span><span data-t="tabPractice"></span></button>
  <button data-v="library"><span class="ic">♫</span><span data-t="tabRep"></span></button>
  <button data-v="stats"><span class="ic">▤</span><span data-t="tabStats"></span></button>
  <button data-v="settings"><span class="ic">⚙</span><span data-t="tabSettings"></span></button>
</nav>

<script>
// ===== BWW parser: extracts title, type, time signature, tempo and the intro (pickup + N full bars) =====
const BWW = (() => {
  const NOTE_RE = /^(LG|LA|B|C|D|E|F|HG|HA)([rl]?)_(1|2|4|8|16|32)$/;
  const DOT_RE = /^('{1,2})(lg|la|b|c|d|e|f|hg|ha)$/;
  // Gracenote / embellishment table (pitches played before the melody note)
  const G = {
    gg:['HG'], tg:['HA'], eg:['E'], dg:['D'], cg:['C'], bg:['B'], ag:['LA'], fg:['F'], hg:['HG'],
    strlg:['LG'], strla:['LA'], strb:['B'], strc:['C'], strd:['D'], stre:['E'], strf:['F'], strhg:['HG'], strha:['HA'],
    dblg:['HG','LG','D'], dbla:['HG','LA','D'], dbb:['HG','B','D'], dbc:['HG','C','D'], dbd:['HG','D','E'],
    dbe:['HG','E','F'], dbf:['HG','F','HG'], dbhg:['HG','F'], dbha:['HA','HG'],
    hdblg:['LG','D'], hdbla:['LA','D'], hdbb:['B','D'], hdbc:['C','D'], hdbd:['D','E'], hdbe:['E','F'], hdbf:['F','HG'],
    tdblg:['HA','LG','D'], tdbla:['HA','LA','D'], tdbb:['HA','B','D'], tdbc:['HA','C','D'], tdbd:['HA','D','E'], tdbe:['HA','E','F'], tdbf:['HA','F','HG'],
    grp:['LG','D','LG'], grpb:['LG','B','LG'], hgrp:['D','LG'], hgrpb:['B','LG'], ggrp:['HG','LG','D','LG'], ggrpb:['HG','LG','B','LG'],
    hgrpc:['D','LG'], ggrpc:['HG','LG','D','LG'], tgrp:['HA','LG','D','LG'],
    tar:['LG','D','LG','E'], tarb:['LG','B','LG','E'], htar:['D','LG','E'],
    thrd:['LG','D','C'], hvthrd:['LG','D','LG','C'], hthrd:['D','C'],
    brl:['LG','LA','LG'], abr:['LA','LG','LA','LG'], gbr:['HG','LA','LG','LA','LG'], tbr:['HA','LA','LG','LA','LG'],
    gstd:['HG','D','LG'], lgstd:['HG','D','C'], hstd:['D','LG'], lhstd:['D','C'], tstd:['HA','D','LG'],
    gstb:['HG','B','LG'], gstc:['HG','C','LG'], gste:['HG','E','LA'], gstf:['HG','F','E'],
    st2la:['LA','LG','LA','LG'], st2b:['B','LG','B','LG'], st2c:['C','LG','C','LG'], st2d:['D','LG','D','LG'],
    pella:['LA','LG'],
  };
  const NAMES = {LG:'Low G',LA:'Low A',B:'B',C:'C',D:'D',E:'E',F:'F',HG:'High G',HA:'High A'};

  function titleCase(s){
    if (s === s.toUpperCase()) s = s.toLowerCase().replace(/(^|\s|\()(\S)/g,(m,a,b)=>a+b.toUpperCase());
    return s.replace(/\s+/g,' ').trim();
  }

  function parse(text, fileName){
    text = text.replace(/\r/g,'');
    const lines = text.split('\n');
    let title = null, type = '', composer = '', tempo = 0;
    for (const ln of lines){
      const m = ln.match(/^"(.*)",\(([A-Z]),/);
      if (m){
        if (m[2]==='T' && !title) title = m[1];
        else if (m[2]==='Y' && !type) type = m[1];
        else if (m[2]==='M' && !composer) composer = m[1];
      }
      const t = ln.match(/^TuneTempo,(\d+)/); if (t) tempo = +t[1];
    }
    if (!title) title = (fileName||'Tune').replace(/\.bww$/i,'').replace(/_/g,' ');
    title = titleCase(title.replace(/[’]/g,"'"));
    // Music: from first '&' line onwards, strip quoted strings / header lines
    const startIdx = lines.findIndex(l => /^\s*&/.test(l));
    if (startIdx < 0) throw new Error('No hay música en el archivo');
    const music = lines.slice(startIdx).filter(l => !/^"/.test(l) && !/^[A-Za-z]+,/.test(l)).join('\n');
    const toks = music.split(/\s+/).filter(Boolean);
    let tsNum = 4, tsDen = 4, tsLabel = '4/4', tsFound = false;
    const bars = []; let cur = [];
    let pendingGrace = [], tieNext = false, tieOpen = false, tripletOpen = false;
    let lastNote = null;
    const flushBar = () => { if (cur.length) { bars.push(cur); cur = []; } };
    for (const tk of toks){
      if (!tsFound){
        let mm = tk.match(/^(\d+)_(\d+)$/);
        if (mm){ tsNum=+mm[1]; tsDen=+mm[2]; tsLabel=`${tsNum}/${tsDen}`; tsFound=true; continue; }
        if (tk==='C'){ tsNum=4; tsDen=4; tsLabel='C'; tsFound=true; continue; }
        if (tk==='C_'){ tsNum=2; tsDen=2; tsLabel='¢'; tsFound=true; continue; }
      }
      const n = tk.match(NOTE_RE);
      if (n){
        const dur = 1/(+n[3]);
        const note = { p:n[1], beam:n[2], base:+n[3], dots:0, dur, grace:pendingGrace, tie:false, trip:tripletOpen };
        if (tripletOpen) note.dur = dur*2/3;
        if ((tieNext || (tieOpen && lastNote && lastNote.tieChain)) && lastNote && lastNote.p===note.p) note.tie = true;
        if (tieOpen) note.tieChain = true;
        tieNext = false; pendingGrace = [];
        cur.push(note); lastNote = note; continue;
      }
      const d = tk.match(DOT_RE);
      if (d && lastNote){ lastNote.dots = d[1].length; lastNote.dur *= d[1].length===1 ? 1.5 : 1.75; continue; }
      if (G[tk]){ pendingGrace = pendingGrace.concat(G[tk]); continue; }
      if (tk==='^ts'){ tieOpen = true; if (lastNote) lastNote.tieChain = false; continue; }
      if (tk==='^te'){ tieOpen = false; continue; }
      if (/^\^t(lg|la|b|c|d|e|f|hg|ha)$/.test(tk)){ tieNext = true; continue; }
      if (tk==='^3s'){ tripletOpen = true; continue; }
      if (tk==='^3e'){ tripletOpen = false; continue; }
      if (/^(!|!t|!I|''!I|I!|I!''|!!t)$/.test(tk) || tk==='&'){ flushBar(); continue; }
      // ignore everything else (sharps, volta marks, spacing, unknown embellishments)
    }
    flushBar();
    const barLen = tsNum/tsDen;
    const sum = b => b.reduce((s,x)=>s+x.dur,0);
    return { title, type: titleCase(type||''), composer, tempo, tsNum, tsDen, tsLabel, barLen, bars, sum };
  }

  // Intro = optional pickup (first bar shorter than a full bar) + nBars full bars
  function intro(tune, nBars=2){
    const out = []; let i = 0; let pickup = null;
    const eps = 1e-6;
    if (tune.bars.length && tune.sum(tune.bars[0]) < tune.barLen - eps){ pickup = tune.bars[0]; i = 1; }
    for (; i < tune.bars.length && out.length < nBars; i++) out.push(tune.bars[i]);
    // a tie at the start of the intro refers to a note we don't show
    const first = (pickup||out[0]||[])[0]; if (first) first.tie = false;
    return { pickup, bars: out };
  }

  // Signature string for comparing intros (pitch sequence of the 2 bars)
  function signature(it){
    const all = [].concat(it.pickup||[], ...it.bars);
    return all.filter(n=>!n.tie).map(n=>n.p).join(' ');
  }
  return { parse, intro, signature, NAMES };
})();
if (typeof module !== 'undefined') module.exports = BWW;

let TUNES = [], LIB_SRC = 'srcEmbed', LIB_DUPES = [], LIB_ERRORS = [];
const normTitle = t => t.toLowerCase().replace(/\(.*?\)/g,'').replace(/^the\s+/,'').replace(/[^a-z0-9]/g,'');
const meterOf = tune => tune.tsLabel==='C' ? '4/4' : tune.tsLabel==='¢' ? '2/2' : `${tune.tsNum}/${tune.tsDen}`;
const tsShow = t => t.ts==='C' ? '4/4 (C)' : t.ts==='¢' ? '2/2 (¢)' : t.ts;
function decode(buf){ try { return new TextDecoder('utf-8',{fatal:true}).decode(buf); } catch(e){ return new TextDecoder('windows-1252').decode(buf); } }
async function fetchText(url){ const r = await fetch(url, {cache:'no-cache'}); if(!r.ok) throw new Error(r.status); return decode(await r.arrayBuffer()); }
async function loadRemote(){
  const h = location.hostname;
  if (/\.github\.io$/.test(h)){
    const owner = h.split('.')[0], seg = location.pathname.split('/').filter(Boolean);
    const repo = seg.length && !/\.html?$/.test(seg[0]) ? seg[0] : h;
    try{
      const r = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/tunes`, {cache:'no-cache'});
      if (r.ok){
        const list = (await r.json()).filter(f => f.type==='file' && /\.(bww|bmw)$/i.test(f.name));
        const files = (await Promise.all(list.map(async f => { try { return {file:f.name, text: await fetchText('tunes/'+encodeURIComponent(f.name))}; } catch(e){ return null; } }))).filter(Boolean);
        if (files.length) return {files, src:'srcGit'};
      }
    }catch(e){}
  }
  try{
    const names = await (await fetch('tunes/index.json', {cache:'no-cache'})).json();
    const files = (await Promise.all(names.map(async n => { try{ return {file:n, text: await fetchText('tunes/'+encodeURIComponent(n))}; }catch(e){ return null; } }))).filter(Boolean);
    if (files.length) return {files, src:'srcFolder'};
  }catch(e){}
  return null;
}
function buildLibrary(baseFiles, localFiles){
  LIB_DUPES = []; LIB_ERRORS = [];
  const byKey = new Map();
  const add = (f, source) => {
    let tune; try { tune = BWW.parse(f.text, f.file); } catch(e){ LIB_ERRORS.push(f.file); return; }
    const intro = BWW.intro(tune, S.bars);
    if (!intro.bars.length){ LIB_ERRORS.push(f.file); return; }
    const key = normTitle(tune.title) || normTitle(f.file);
    const item = { id:key, title:tune.title, type:tune.type, ts:tune.tsLabel, meter:meterOf(tune), file:f.file, source, tune, intro, size:f.text.length, sig: BWW.signature(intro) };
    const prev = byKey.get(key);
    if (prev){
      const better = (!!item.type - !!prev.type) || (item.size - prev.size);
      const keepNew = (source==='local' && prev.source!=='local') || (source===prev.source && better > 0);
      LIB_DUPES.push(keepNew ? prev.file : item.file);
      if (keepNew) byKey.set(key, item);
    } else byKey.set(key, item);
  };
  baseFiles.forEach(f => add(f, 'base'));
  localFiles.forEach(f => add(f, 'local'));
  const sk = t => t.title.replace(/^(the|a)\s+/i,'').toLowerCase();
  TUNES = [...byKey.values()].sort((a,b)=>sk(a).localeCompare(sk(b)));
  // fill in missing types from duplicates' siblings is not possible; leave blank
  updInfo();
}
const updInfo = () => { $('libInfo').textContent = tr('libInfo', {n:TUNES.length, b:S.bars}); };
let BASE_FILES = EMBED;
const localFiles = () => store.get('tmt_local', []);

// ---------- notation (SVG) ----------
const STEP = {LG:2, LA:3, B:4, C:5, D:6, E:7, F:8, HG:9, HA:10};
const SHORT = {LG:'LG', LA:'LA', B:'B', C:'C', D:'D', E:'E', F:'F', HG:'HG', HA:'HA'};
function renderIntro(t, opt={}){
  const names = !!opt.names, showGrace = opt.grace !== false;
  const g = 10, y0 = 46;                       // top staff line (F)
  const yOf = st => y0 + (8 - st) * g/2;
  const yBeam = y0 + 4*g + 20, yGr = y0 - 2.7*g;
  const ink = 'currentColor';
  let x = 12, out = [], idx = 0;
  const notesAll = [];
  // time signature
  const ts = t.tune;
  if (ts.tsLabel==='C' || ts.tsLabel==='¢') out.push(`<text x="${x+2}" y="${y0+2.75*g}" font-family="Georgia,serif" font-size="27" font-weight="700" fill="${ink}">C</text>`);
  else { out.push(`<text x="${x+3}" y="${y0+1.85*g}" font-family="Georgia,serif" font-size="19" font-weight="700" fill="${ink}">${ts.tsNum}</text>`);
         out.push(`<text x="${x+3}" y="${y0+3.85*g}" font-family="Georgia,serif" font-size="19" font-weight="700" fill="${ink}">${ts.tsDen}</text>`); }
  x += 30;
  const bars = [].concat(t.intro.pickup ? [t.intro.pickup] : [], t.intro.bars);
  const barlines = [];
  bars.forEach((bar, bi) => {
    const groups = []; let open = null;
    bar.forEach(n => {
      // grace notes
      const gn = showGrace ? n.grace : [];
      const gx = [];
      gn.forEach(p => { x += 6; gx.push(x); });
      if (gn.length) x += 9;
      const nx = x + 6;
      const rec = {n, x:nx, y:yOf(STEP[n.p]), i:idx++, gx, gp:gn};
      notesAll.push(rec);
      if (n.base >= 8){
        if (open){ open.push(rec); if (n.beam==='l'){ groups.push(open); open=null; } }
        else if (n.beam==='r'){ open = [rec]; }
        else groups.push([rec]);
      } else { if (open){ groups.push(open); open=null; } groups.push([rec]); }
      x = nx + 10 + n.dur * 105;
    });
    if (open) groups.push(open);
    bar._groups = groups;
    x += 4; barlines.push(x); x += 10;
  });
  const W = x;
  // staff lines
  for (let i=0;i<5;i++) out.push(`<line x1="4" x2="${W-10}" y1="${y0+i*g}" y2="${y0+i*g}" stroke="${ink}" stroke-width="1" opacity=".55"/>`);
  out.push(`<line x1="4" x2="4" y1="${y0}" y2="${y0+4*g}" stroke="${ink}" stroke-width="1.2"/>`);
  barlines.forEach((bx,k) => out.push(`<line x1="${bx}" x2="${bx}" y1="${y0}" y2="${y0+4*g}" stroke="${ink}" stroke-width="${k===barlines.length-1?2:1.2}"/>`));
  // notes
  const parts = [];
  notesAll.forEach(r => {
    const n = r.n, hollow = n.base <= 2, sx = r.x - 5.2;
    let s = `<g class="n" data-i="${r.i}" data-p="${n.p}">`;
    s += `<rect x="${r.x-9}" y="${y0-3*g}" width="18" height="${8.5*g}" fill="transparent"/>`;
    if (n.p==='HA') s += `<line x1="${r.x-9}" x2="${r.x+9}" y1="${y0-g}" y2="${y0-g}" stroke="${ink}"/>`;
    s += `<ellipse class="hd" cx="${r.x}" cy="${r.y}" rx="5.6" ry="4" transform="rotate(-22 ${r.x} ${r.y})" fill="${hollow?'none':ink}" stroke="${ink}" stroke-width="${hollow?1.6:1}"/>`;
    if (n.base > 1) s += `<line x1="${sx}" x2="${sx}" y1="${r.y+1}" y2="${yBeam}" stroke="${ink}" stroke-width="1.3"/>`;
    for (let d=0; d<n.dots; d++){ const st = STEP[n.p]; const dy = st%2===0 ? r.y - g/2 : r.y; s += `<circle cx="${r.x+9+d*5}" cy="${dy}" r="1.8" fill="${ink}"/>`; }
    if (names) s += `<text class="nm" x="${r.x-2}" y="${yBeam+17}" text-anchor="middle" font-size="11" font-weight="600" fill="${ink}">${SHORT[n.p]}</text>`;
    s += '</g>';
    parts.push(s);
    // grace notes
    if (r.gp.length){
      r.gp.forEach((p,k) => {
        const gx = r.gx[k], gy = yOf(STEP[p]);
        if (p==='HA') out.push(`<line x1="${gx-5}" x2="${gx+5}" y1="${y0-g}" y2="${y0-g}" stroke="${ink}" stroke-width=".8"/>`);
        out.push(`<ellipse cx="${gx}" cy="${gy}" rx="3.2" ry="2.3" transform="rotate(-22 ${gx} ${gy})" fill="${ink}"/>`);
        out.push(`<line x1="${gx+2.9}" x2="${gx+2.9}" y1="${gy-.5}" y2="${yGr}" stroke="${ink}" stroke-width=".8"/>`);
      });
      const fx = r.gx[0]+2.9, lx = r.gx[r.gx.length-1]+2.9;
      if (r.gp.length > 1) for (let b=0;b<3;b++) out.push(`<line x1="${fx}" x2="${lx}" y1="${yGr+b*2.6}" y2="${yGr+b*2.6}" stroke="${ink}" stroke-width="1.4"/>`);
      else for (let b=0;b<3;b++) out.push(`<path d="M${fx} ${yGr+b*3} l4 3.5" stroke="${ink}" stroke-width="1" fill="none"/>`);
    }
  });
  // beams / flags
  bars.forEach(bar => bar._groups.forEach(gr => {
    const lv = r => r.n.base>=32?3 : r.n.base>=16?2 : r.n.base>=8?1 : 0;
    if (gr.length === 1){
      const r = gr[0], L = lv(r), sx = r.x-5.2;
      for (let k=0;k<L;k++) out.push(`<path d="M${sx} ${yBeam-k*6} q 3 -4 8 -9" stroke="${ink}" stroke-width="1.6" fill="none"/>`);
      return;
    }
    const xs = gr.map(r => r.x-5.2);
    out.push(`<line x1="${xs[0]}" x2="${xs[xs.length-1]}" y1="${yBeam}" y2="${yBeam}" stroke="${ink}" stroke-width="3.4"/>`);
    for (let L=2; L<=3; L++){
      let k = 0;
      while (k < gr.length){
        if (lv(gr[k]) < L){ k++; continue; }
        let e = k; while (e+1 < gr.length && lv(gr[e+1]) >= L) e++;
        const yy = yBeam - (L-1)*6;
        if (e > k) out.push(`<line x1="${xs[k]}" x2="${xs[e]}" y1="${yy}" y2="${yy}" stroke="${ink}" stroke-width="3.4"/>`);
        else { const left = k>0 && (k===gr.length-1 || gr[k-1].n.dots); const x1 = xs[k], x2 = left ? x1-7 : x1+7;
               out.push(`<line x1="${x1}" x2="${x2}" y1="${yy}" y2="${yy}" stroke="${ink}" stroke-width="3.4"/>`); }
        k = e+1;
      }
    }
    if (gr.some(r=>r.n.trip)){ const mx=(xs[0]+xs[xs.length-1])/2; out.push(`<text x="${mx}" y="${yBeam+(names?30:13)}" text-anchor="middle" font-size="10" font-style="italic" fill="${ink}">3</text>`); }
  }));
  // ties (above heads)
  notesAll.forEach((r,k) => { if (r.n.tie && k>0){ const a = notesAll[k-1]; const ya = Math.min(a.y, r.y) - 7;
    out.push(`<path d="M${a.x+3} ${ya} Q ${(a.x+r.x)/2} ${ya-9} ${r.x-3} ${ya}" stroke="${ink}" stroke-width="1.3" fill="none"/>`); } });
  const H = yBeam + (names ? 30 : 14);
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="color:var(--ink)">${out.join('')}${parts.join('')}</svg>`;
}
function seqText(t){
  const bars = [].concat(t.intro.pickup ? [t.intro.pickup] : [], t.intro.bars);
  return bars.map(b => b.filter(n=>!n.tie).map(n=>SHORT[n.p]).join(' ')).join(' <span class="bar">|</span> ');
}

const RATIO = {LG:7/8, LA:1, B:9/8, C:5/4, D:4/3, E:3/2, F:5/3, HG:7/4, HA:2};
const LA_HZ = 480;
let AC = null, live = [], timers = [];
function ac(){ if (!AC) AC = new (window.AudioContext||window.webkitAudioContext)(); if (AC.state==='suspended') AC.resume(); return AC; }
// iOS: play sound even when the silent switch is on
let _iosUnlocked=false;
function unlockIOSAudio(){

function voice(c, t0, t1, gainVal){
  const o = c.createOscillator(); o.type = 'sawtooth';
  const o2 = c.createOscillator(); o2.type = 'square';
  const hp = c.createBiquadFilter(); hp.type='highpass'; hp.frequency.value = 350;
  const p1 = c.createBiquadFilter(); p1.type='peaking'; p1.frequency.value=1300; p1.Q.value=1.2; p1.gain.value=7;
  const p2 = c.createBiquadFilter(); p2.type='peaking'; p2.frequency.value=3000; p2.Q.value=1.5; p2.gain.value=5;
  const lp = c.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value = 6500;
  const g2 = c.createGain(); g2.gain.value = .25;
  const g = c.createGain(); g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(gainVal, t0+.015);
  g.gain.setValueAtTime(gainVal, t1-.03); g.gain.linearRampToValueAtTime(0, t1);
  o.connect(hp); o2.connect(g2); g2.connect(hp); hp.connect(p1); p1.connect(p2); p2.connect(lp); lp.connect(g); g.connect(c.destination);
  o.start(t0); o2.start(t0); o.stop(t1+.05); o2.stop(t1+.05); live.push(o, o2);
  return f => (fq, t) => { o.frequency.setValueAtTime(fq, t); o2.frequency.setValueAtTime(fq, t); };
}
function drones(c, t0, t1){
  [[LA_HZ/2,.045],[LA_HZ/4,.05]].forEach(([f,v]) => {
    const o = c.createOscillator(); o.type='sawtooth'; o.frequency.value = f;
    const lp = c.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value = 1400;
    const g = c.createGain(); g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(v,t0+.2); g.gain.setValueAtTime(v,t1-.15); g.gain.linearRampToValueAtTime(0,t1);
    o.connect(lp); lp.connect(g); g.connect(c.destination); o.start(t0); o.stop(t1+.05); live.push(o);
  });
}
function playIntro(t, svgRoot){
  stopAll();
  const c = ac(), tune = t.tune;
  const beatWhole = (tune.tsDen===8 && tune.tsNum%3===0) ? 3/8 : 1/tune.tsDen;
  const bpm = (tune.tempo || 80) * S.speed;
  const secWhole = 60 / bpm / beatWhole;
  const gd = 0.032;
  const bars = [].concat(t.intro.pickup ? [t.intro.pickup] : [], t.intro.bars);
  const notes = [].concat(...bars);
  const lead = S.drones ? 0.6 : 0.05;
  const start = c.currentTime + lead;
  let tt = start; const ev = [];
  notes.forEach((n, i) => {
    const d = n.dur * secWhole;
    if (!n.tie || !ev.length){
      n.grace.forEach((p,k) => ev.push({t: tt + k*gd, f: LA_HZ*RATIO[p]}));
      ev.push({t: tt + n.grace.length*gd, f: LA_HZ*RATIO[n.p]});
    }
    if (svgRoot){
      const el = svgRoot.querySelector(`.n[data-i="${i}"]`);
      if (el){ timers.push(setTimeout(()=>el.classList.add('on'), (tt - c.currentTime)*1000));
               timers.push(setTimeout(()=>el.classList.remove('on'), (tt + d - c.currentTime)*1000 - 15)); }
    }
    tt += d;
  });
  const end = tt + 0.25;
  if (S.drones) drones(c, start-0.55, end+0.1);
  const set = voice(c, start, end, .2)();
  ev.forEach(e => set(e.f, e.t));
  return end - c.currentTime;
}
function playNote(p){
  stopAll(); const c = ac(); const t0 = c.currentTime + .02;
  const set = voice(c, t0, t0+.6, .2)(); set(LA_HZ*RATIO[p], t0);
}

// ---------- spaced repetition ----------
const boxOf = (m,id) => (P.box[m] && P.box[m][id]) || 0;
function grade(m, id, correct, chosenId){
  P.box[m] = P.box[m] || {}; P.hist[id] = P.hist[id] || {};
  const h = P.hist[id][m] = P.hist[id][m] || {ok:0,bad:0};
  if (correct === true){ h.ok++; P.box[m][id] = Math.min(5, boxOf(m,id)+1); }
  else if (correct === false){ h.bad++; P.box[m][id] = 1;
    if (chosenId){ P.conf[id] = P.conf[id] || {}; P.conf[id][chosenId] = (P.conf[id][chosenId]||0)+1; } }
  P.hist[id].last = Date.now();
  saveP();
}
const recent = [];
function pickTune(m){
  let pool = TUNES;
  if (S.hard){
    const hard = TUNES.filter(t => { const b = boxOf(m,t.id); return b===1 || (P.conf[t.id] && Object.keys(P.conf[t.id]).length); });
    if (hard.length >= 1) pool = hard;
  }
  const W = pool.map(t => { if (recent.includes(t.id) && pool.length > 3) return 0; const b = boxOf(m,t.id); return b===0 ? 3 : Math.pow(2, 5-b) / 4; });
  let r = Math.random() * W.reduce((a,b)=>a+b,0);
  for (let i=0;i<pool.length;i++){ r -= W[i]; if (r <= 0) return pool[i]; }
  return pool[pool.length-1];
}
function lev(a, b){ a=a.split(' '); b=b.split(' '); const d = Array.from({length:a.length+1},(_,i)=>[i]); for(let j=1;j<=b.length;j++) d[0][j]=j;
  for (let i=1;i<=a.length;i++) for (let j=1;j<=b.length;j++) d[i][j] = Math.min(d[i-1][j]+1, d[i][j-1]+1, d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return d[a.length][b.length]; }
function similarity(x, y){ const a = x.sig.split(' ').slice(0,10).join(' '), b = y.sig.split(' ').slice(0,10).join(' ');
  return 1 - lev(a,b) / Math.max(a.split(' ').length, b.split(' ').length); }
function distractors(t){
  const others = TUNES.filter(o => o.id !== t.id);
  const conf = P.conf[t.id] || {};
  const scored = others.map(o => ({o, s: similarity(t,o) + (o.ts===t.ts?.15:0) + (conf[o.id]?1:0) + ((P.conf[o.id]||{})[t.id]?.5:0) + Math.random()*.35 }));
  scored.sort((a,b)=>b.s-a.s);
  // 2 "hard" distractors + 1 random for variety
  const pick = scored.slice(0,2).map(x=>x.o);
  const rest = others.filter(o => !pick.includes(o));
  if (rest.length) pick.push(rest[Math.floor(Math.random()*rest.length)]);
  return pick.slice(0, Math.min(3, others.length));
}
const shuffle = a => { for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };



// ---------- practice UI ----------
let sess = {n:0, ok:0, streak:0}, curQ = null;
function updSess(){ $('sess').textContent = tr('sess', {ok:sess.ok, n:sess.n}); $('streak').textContent = sess.streak>=3 ? tr('streak', {n:sess.streak}) : ''; }
function staffBox(t, names, id){ return `<div class="staff" id="${id}">${renderIntro(t,{names, grace:S.grace})}</div>`; }
function wireStaff(id){ const box = $(id); if (box) box.querySelectorAll('.n').forEach(el => el.addEventListener('click', () => playNote(el.dataset.p))); }
function revealHTML(t, id='revStaff', withTitle=true){
  return `<div class="reveal">
    ${withTitle ? `<h3>${esc(t.title)}</h3><div class="meta">${esc([t.type, tsShow(t)].filter(Boolean).join(' · '))}</div>` : ''}
    ${staffBox(t, true, id)}
    <div class="seq">${seqText(t)}</div>
    <div class="row"><button class="btn primary" data-play="${id}">${tr('listen')}</button><span class="hint">${tr('tapNote')}</span></div>
  </div>`;
}
function wireReveal(t, autoplay, id='revStaff'){
  wireStaff(id);
  const btn = document.querySelector(`[data-play="${id}"]`);
  const play = () => playIntro(t, $(id));
  if (btn) btn.onclick = play;
  if (autoplay) play();
}
function nextQ(){
  stopAll();
  const m = S.mode, card = $('qcard');
  if (TUNES.length < 2){ card.innerHTML = `<p>${tr('need2')}</p>`; return; }
  const t = pickTune(m);
  curQ = t;
  recent.push(t.id); if (recent.length > 3) recent.shift();
  if (m === 'recall') return recallQ(t);
  if (m === 'meter') return meterQ(t);
  const opts = shuffle([t, ...distractors(t)]);
  let top = '';
  if (m === 'audio') top = `<p class="prompt">${tr('pAudio',{b:S.bars})}</p><button class="big-play" id="qPlay">${tr('playIntro')}</button>`;
  else top = `<p class="prompt">${m==='combo' ? tr('pCombo') : tr('pVisual')}</p>${staffBox(t, false, 'qStaff')}`;
  card.innerHTML = `${top}<div class="opts">${opts.map(o => `<button class="opt" data-id="${o.id}">${esc(o.title)}</button>`).join('')}</div><div id="qRes"></div>`;
  if (m === 'audio'){ $('qPlay').onclick = () => playIntro(t, null); setTimeout(()=>playIntro(t,null), 150); }
  card.querySelectorAll('.opt').forEach(b => b.onclick = () => answer(t, b.dataset.id, m));
}
function scoreSess(ok){ sess.n++; if (ok){ sess.ok++; sess.streak++; } else sess.streak = 0; updSess(); }
function answer(t, chosen, m){
  const card = $('qcard'), ok = chosen === t.id;
  card.querySelectorAll('.opt').forEach(b => { b.disabled = true; if (b.dataset.id===t.id) b.classList.add('ok'); else if (b.dataset.id===chosen) b.classList.add('bad'); });
  grade(m, t.id, ok, ok ? null : chosen); scoreSess(ok);
  const wrong = TUNES.find(x => x.id===chosen);
  let html = `<div class="fb ${ok?'ok':'bad'}">${ok ? tr('ok') : tr('bad')}</div>`;
  if (m !== 'audio' && $('qStaff')) $('qStaff').remove();
  html += revealHTML(t);
  if (!ok && wrong) html += `<div class="card" style="margin-top:12px"><div class="meta">${tr('yourPick')}</div><h3 style="font:700 16px Georgia,serif;margin:2px 0">${esc(wrong.title)}</h3>${revealHTML(wrong,'wrongStaff',false)}</div>`;
  html += `<div class="row" style="margin-top:12px"><button class="btn primary" id="qNext">${tr('next')}</button></div>`;
  $('qRes').innerHTML = html;
  wireReveal(t, m !== 'audio');
  if (wrong && !ok) wireReveal(wrong, false, 'wrongStaff');
  $('qNext').onclick = nextQ;
  $('qRes').scrollIntoView({behavior:'smooth', block:'nearest'});
}
function recallQ(t){
  const card = $('qcard');
  card.innerHTML = `<p class="prompt">${tr('pRecall',{b:S.bars})}</p>
    <div class="recall-title">${esc(t.title)}</div><div class="center hint">${esc(t.type||'')}</div>
    <div class="row" style="justify-content:center;margin-top:16px"><button class="btn primary" id="rShow">${tr('showStart')}</button></div><div id="qRes"></div>`;
  $('rShow').onclick = () => {
    $('rShow').parentElement.remove();
    $('qRes').innerHTML = `<div class="meta center">${esc(tsShow(t))}</div>` + revealHTML(t,'revStaff',false) +
      `<p class="prompt" style="margin-top:12px">${tr('didYou')}</p><div class="row"><button class="btn" data-g="1">${tr('gYes')}</button><button class="btn" data-g="0">${tr('gMaybe')}</button><button class="btn" data-g="-1">${tr('gNo')}</button></div>`;
    wireReveal(t, true);
    $('qRes').querySelectorAll('[data-g]').forEach(b => b.onclick = () => {
      const g = +b.dataset.g; grade('recall', t.id, g===1 ? true : g===-1 ? false : null); scoreSess(g===1); nextQ();
    });

}
const METERS_BASE = ['2/4','3/4','4/4','6/8'];
function meterQ(t){
  const card = $('qcard');
  const present = new Set(METERS_BASE.concat(TUNES.map(x=>x.meter)));
  const order = ['2/2','2/4','3/4','4/4','6/8','9/8','12/8'];
  const opts = [...present].sort((a,b)=>order.indexOf(a)-order.indexOf(b));
  card.innerHTML = `<p class="prompt">${tr('pMeter')}</p><button class="big-play" id="qPlay">${tr('playIntro')}</button>
    <div class="opts meter-opts">${opts.map(o => `<button class="opt" data-ts="${o}">${o}</button>`).join('')}</div><div id="qRes"></div>`;
  $('qPlay').onclick = () => playIntro(t, null); setTimeout(()=>playIntro(t,null), 150);
  card.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    const ok = b.dataset.ts === t.meter;
    card.querySelectorAll('.opt').forEach(x => { x.disabled = true; if (x.dataset.ts===t.meter) x.classList.add('ok'); else if (x===b) x.classList.add('bad'); });
    grade('meter', t.id, ok); scoreSess(ok);
    const tip = tr('tip_'+t.meter.replace('/',''));
    $('qRes').innerHTML = `<div class="fb ${ok?'ok':'bad'}">${ok ? tr('okMeter',{ts:t.meter}) : tr('badMeter',{ts:t.meter})}</div><div class="tip">${esc(tip)}</div>` + revealHTML(t) +
      `<div class="row" style="margin-top:12px"><button class="btn primary" id="qNext">${tr('next')}</button></div>`;
    wireReveal(t, false); $('qNext').onclick = nextQ;
    $('qRes').scrollIntoView({behavior:'smooth', block:'nearest'});
  });
}

// ---------- repertoire UI ----------
let libFilter = '', libType = '', libOpen = null;
function renderLibrary(){
  $('libSearch').placeholder = tr('search');
  const types = [...new Set(TUNES.map(t => t.type || tr('other')))].sort();
  $('libChips').innerHTML = [`<button data-ty="" class="${libType===''?'on':''}">${tr('all')} (${TUNES.length})</button>`]
    .concat(types.map(ty => `<button data-ty="${esc(ty)}" class="${libType===ty?'on':''}">${esc(ty)} (${TUNES.filter(t=>(t.type||tr('other'))===ty).length})</button>`)).join('');
  $('libChips').querySelectorAll('button').forEach(b => b.onclick = () => { libType = b.dataset.ty; renderLibrary(); });
  const q = libFilter.toLowerCase();
  const list = TUNES.filter(t => (!libType || (t.type||tr('other'))===libType) && (!q || t.title.toLowerCase().includes(q)));
  const groups = {};
  list.forEach(t => (groups[t.type || tr('other')] = groups[t.type || tr('other')] || []).push(t));
  $('libList').innerHTML = Object.keys(groups).sort().map(g => `<div class="grp-h">${esc(g)}</div>` + groups[g].map(t => `
    <div class="lib-item ${libOpen===t.id?'open':''}" data-id="${t.id}"><div><div class="t">${esc(t.title)}</div><div class="sq">${tsShow(t)} · ${t.sig.split(' ').slice(0,8).join(' ')}…</div></div>${t.source==='local' ? `<span class="pill local">${tr('local')}</span>` : ''}</div>
    ${libOpen===t.id ? `<div class="lib-detail">${revealHTML(t,'libStaff',false)}<p class="hint">${tr('file')}: ${esc(t.file)}</p>${t.source==='local' ? `<button class="btn small" id="delLocal">${tr('removeLocal')}</button>` : ''}</div>` : ''}`).join('')).join('');
  $('libList').querySelectorAll('.lib-item').forEach(el => el.onclick = () => { stopAll(); libOpen = libOpen===el.dataset.id ? null : el.dataset.id; renderLibrary(); });
  if (libOpen){ const t = TUNES.find(x=>x.id===libOpen); if (t){ wireReveal(t, false, 'libStaff');
    if ($('delLocal')) $('delLocal').onclick = () => { store.set('tmt_local', localFiles().filter(f => f.file !== t.file)); libOpen=null; rebuild(); renderLibrary(); }; } }
  $('libSource').innerHTML = `${tr('src')}: ${esc(tr(LIB_SRC))}.` +
    (LIB_DUPES.length ? ` ${tr('dupes')}: ${LIB_DUPES.map(esc).join(', ')}.` : '') +
    (LIB_ERRORS.length ? ` <span class="err">${tr('errs')}: ${LIB_ERRORS.map(esc).join(', ')}.</span>` : '');
}
$('libSearch').oninput = e => { libFilter = e.target.value; renderLibrary(); };
$('fileIn').onchange = async e => {
  const files = [...e.target.files]; const cur = localFiles(); const msgs = [];
  for (const f of files){
    const text = decode(await f.arrayBuffer());
    try { const t = BWW.parse(text, f.name); if (!BWW.intro(t, S.bars).bars.length) throw 0;
          const i = cur.findIndex(x=>x.file===f.name); if (i>=0) cur.splice(i,1); cur.push({file:f.name, text}); msgs.push('✓ '+t.title); }
    catch(err){ msgs.push(`✗ ${f.name} (${tr('unreadable')})`); }
  }
  store.set('tmt_local', cur); rebuild(); renderLibrary(); $('addMsg').textContent = msgs.join(' · '); e.target.value = '';
};

// ---------- stats UI ----------
const MODES = ['audio','visual','combo','recall','meter'];
function renderStats(){
  let ok=0, bad=0; const byT = TUNES.map(t => { const h = P.hist[t.id]||{}; let o=0,b=0; MODES.forEach(m => { if(h[m]){ o+=h[m].ok; b+=h[m].bad; } }); ok+=o; bad+=b; return {t,o,b}; });
  const mastered = TUNES.filter(t => ['audio','visual'].every(m => boxOf(m,t.id) >= 3)).length;
  $('kpis').innerHTML = `<div class="kpi"><b>${ok+bad ? Math.round(100*ok/(ok+bad)) : 0}%</b><span>${tr('kAcc')}</span></div><div class="kpi"><b>${ok+bad}</b><span>${tr('kAns')}</span></div><div class="kpi"><b>${mastered}/${TUNES.length}</b><span>${tr('kMast')}</span></div>`;
  const pairs = []; for (const a in P.conf) for (const b in P.conf[a]) pairs.push({a, b, n:P.conf[a][b]});
  pairs.sort((x,y)=>y.n-x.n);
  const T = id => TUNES.find(t=>t.id===id);
  const vp = pairs.filter(p=>T(p.a)&&T(p.b)).slice(0,8);
  $('confList').innerHTML = vp.length ? '<table class="st">' + vp.map(p => `<tr><td><b>${esc(T(p.a).title)}</b><br><span class="hint">${tr('confWith',{x:esc(T(p.b).title)})}</span></td><td class="num">${p.n}×</td></tr>`).join('') + '</table>' : `<p class="hint">${tr('noConf')}</p>`;
  const sims = []; for (let i=0;i<TUNES.length;i++) for (let j=i+1;j<TUNES.length;j++) sims.push({a:TUNES[i], b:TUNES[j], s:similarity(TUNES[i],TUNES[j])});
  sims.sort((x,y)=>y.s-x.s);
  $('simList').innerHTML = '<table class="st">' + sims.slice(0,6).map(p => `<tr><td><b>${esc(p.a.title)}</b> / <b>${esc(p.b.title)}</b><div class="seq" style="font-size:12.5px">${seqText(p.a)}<br>${seqText(p.b)}</div></td><td class="num">${Math.round(p.s*100)}%</td></tr>`).join('') + '</table>';
  byT.sort((x,y) => ((x.o+x.b)? x.o/(x.o+x.b) : 2) - ((y.o+y.b)? y.o/(y.o+y.b) : 2));
  $('perTune').innerHTML = byT.map(({t,o,b}) => { const tot=o+b, pc = tot? Math.round(100*o/tot):null;
    return `<tr><td>${esc(t.title)}</td><td style="width:90px"><div class="bar-wrap"><div class="bar-fill" style="width:${pc||0}%"></div></div></td><td class="num">${tot? pc+'% · '+tot : '—'}</td></tr>`; }).join('');
}
